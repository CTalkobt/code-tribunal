# Code-Tribunal Configuration File
# =============================================================
# This is the default configuration for the Council debate system.
# All options are enumerated below with descriptions.
#
# Format: key=value (one per line)
# Comments: lines starting with # are ignored
# Multiple values: repeat the key=value line (e.g., for models, ollama_url)
#
# USAGE:
#   ./council "query text"                          # Uses this config
#   ./council --web                                 # Web dashboard with this config
#   ./council --config path/to/custom.conf "query"  # Custom config file
#
# NOTE: Command-line arguments override config file settings.
# =============================================================

# ============================================================
# OLLAMA CONFIGURATION
# ============================================================

# Ollama server endpoints (can be specified multiple times)
# Default: http://localhost:11434
# Multi-endpoint support: specify multiple ollama_url lines for parallel execution
#   Single endpoint   → sequential mode (stable)
#   Multiple endpoints → parallel mode (N-way parallelism where N = endpoint count)
#
# Examples:
#   ollama_url=http://localhost:11434               # Single local instance (default)
#   ollama_url=http://gpu1:11434                    # Remote GPU 1
#   ollama_url=http://gpu2:11434                    # Remote GPU 2 (parallel with GPU 1)

ollama_url=http://localhost:11434

# Ollama request timeout in seconds (default: 120)
# Increase if queries are timing out; decrease for faster failure detection
# ollama_timeout=120

# ============================================================
# DEBATE CONFIGURATION
# ============================================================

# Number of debate rounds before final decision (default: 4)
# More rounds = more thorough analysis but slower execution
# Recommended: 4 for standard use, 2 for constrained resources
rounds=4

# ============================================================
# ANALYST POOL CONFIGURATION
# ============================================================

# Analyst models in role order: security, performance, correctness, style
# Specify one per line. Must have at least 4 base analysts.
# Different models per role lead to more meaningful elections and debates.
#
# Examples of model assignments:
#   model=llama3.2                    # Security analyst
#   model=mistral                     # Performance analyst
#   model=neural-chat                 # Correctness analyst
#   model=dolphin-mixtral             # Style analyst
#
# For constrained resources, use lightweight models:
#   model=phi3:mini
#   model=qwen2.5-coder:latest
#
# Current configuration: 4 analysts for standard debate

model=llama3.2
model=llama3.2
model=llama3.2
model=qwen3.5:latest

# ============================================================
# ELECTION CONFIGURATION
# ============================================================

# First election round (1-based index, default: 1)
# Analysts vote to select top performers after this many rounds
# Recommended: 1-2 for early filtering
election_start=1

# Multiply election interval by this factor after each election (default: 2)
# Example: election_start=1, election_backoff=2 → elections at rounds 1, 3, 7, 15...
# Higher values = less frequent elections as debate progresses
election_backoff=2

# Maximum rounds between elections (default: 8)
# Prevents elections from becoming too infrequent in long debates
election_max=8

# Fallback/tiebreak model for elections when no consensus reached (default: llama3.2)
# Used when analysts cannot agree or when breaking voting ties
judge_model=llama3.2

# ============================================================
# DYNAMIC SPAWNING CONFIGURATION
# ============================================================

# Enable/disable dynamic analyst spawning (1=enabled, 0=disabled, default: 1)
# If enabled, analysts can vote to add specialists after spawn_check_round
spawn_enabled=1

# Round after which analysts can vote to spawn new specialists (1-based, default: 1)
# Early rounds focus on base 4 analysts; spawning adds depth after initial analysis
spawn_check_round=1

# ============================================================
# ANALYST PRUNING CONFIGURATION
# ============================================================

# Enable/disable removal of inactive analysts (1=enabled, 0=disabled, default: 1)
# If enabled, analysts with no contributions for prune_interval rounds go to removal vote
prune_enabled=1

# Rounds without contribution before an analyst faces removal vote (default: 3)
# Higher values = more lenient (analysts get more chances)
prune_interval=3

# Rounds of immunity after a dynamic analyst is spawned (default: 2)
# Prevents newly-spawned analysts from immediate pruning if they don't immediately contribute
prune_grace=2

# Never prune below this many analysts in the pool (default: 2)
# Ensures minimum debate diversity even if some are inactive
min_analysts=2

# Trigger spawn vote after successful pruning (1=yes, 0=no, default: 1)
# If enabled, pruning a low-performer triggers a vote to add a replacement specialist
prune_respawn=1

# ============================================================
# OUTPUT & OPTIMIZATION CONFIGURATION
# ============================================================

# API type for LLM queries (default: "ollama")
# Currently only "ollama" is supported
# api_type=ollama

# Enable pruning/optimization of debate state (1=yes, 0=no, default: 1)
# If enabled, removes redundant analysis and consolidates findings
# prune_enabled=1

# ============================================================
# CONFIGURATION EXAMPLES
# =============================================================
#
# MULTI-ENDPOINT SETUP (for 2x parallelism):
#   ollama_url=http://localhost:11434
#   ollama_url=http://localhost:11435
#   Result: Debates run ~2x faster with parallel Ollama instances
#
# CONSTRAINED RESOURCES (limited VRAM):
#   rounds=2
#   model=phi3:mini
#   model=phi3:mini
#   model=phi3:mini
#   model=phi3:mini
#   prune_enabled=0
#   spawn_enabled=0
#   Result: Minimal resource usage, faster analysis
#
# MAXIMUM PERFORMANCE (4 high-end GPUs):
#   ollama_url=http://gpu1:11434
#   ollama_url=http://gpu2:11434
#   ollama_url=http://gpu3:11434
#   ollama_url=http://gpu4:11434
#   rounds=6
#   spawn_enabled=1
#   prune_enabled=1
#   Result: 4x parallelism with deep multi-round debate and dynamic analysts
#
# =============================================================
