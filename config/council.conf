# LLM Council configuration
# ============================================================

# -- Debate --
rounds=4

# -- Election schedule --
# first election after this many completed rounds
election_start=1
# multiply interval by this after each election
election_backoff=2
# cap interval at this many rounds
election_max=8

# Fallback/tiebreak model when no election has been held or vote ties
judge_model=llama3.2

# -- Dynamic role spawning --
# 1 = analysts vote after spawn_check_round to add a new specialist
spawn_enabled=1
# round after which the first spawn vote is considered (1-based)
spawn_check_round=1

# -- Pruning --
# 1 = analysts with no contribution for prune_interval rounds go to a removal vote
prune_enabled=1
# rounds without a code proposal before removal vote is triggered
prune_interval=3
# rounds of immunity after a dynamic analyst is spawned
prune_grace=2
# never prune below this many analysts
min_analysts=2
# 1 = trigger a spawn vote after a successful prune (to fill the gap)
prune_respawn=1

# -- Analyst models --
# One per line in role order: security, performance, correctness, style
# Dynamic analysts use judge_model by default.
# Using different models per role makes elections and spawn votes more meaningful.
model=llama3.2
model=llama3.2
model=llama3.2
model=llama3.2
